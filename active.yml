name: Generate DNS Profile
on:
  workflow_dispatch: # Chạy thủ công bằng nút bấm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Generator
        run: python main.py
      - name: Upload DNS Profile
        uses: actions/upload-artifact@v4
        with:
          name: DNS-MobileConfig
          path: dns.mobileconfig
